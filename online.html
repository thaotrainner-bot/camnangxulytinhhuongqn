            <!-- Tìm kiếm -->
            <div class="w-full md:w-1/3 relative">
                <input type="text" id="searchInput" style="border:1px solid #b7cdb9" placeholder="Tìm tình huống... (gõ không dấu cũng được)"
                    class="w-full px-4 py-2 pr-10 rounded-lg text-gray-800 focus:outline-none focus:ring-2 focus:ring-secondary">
                <button id="clearSearch" class="hidden absolute right-9 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600" title="Xóa">
                    <i class="fa fa-times-circle"></i>
                </button>
                <i class="fa fa-search absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 pointer-events-none"></i>
            </div>
        </div>
    </header>

    <!-- Thông tin trạng thái -->
    <div class="container mx-auto px-4 py-3">
        <div id="statusBar" class="bg-blue-50 border-l-4 border-blue-500 p-3 rounded-r mb-6">
            <p class="text-sm text-blue-700">
                <i class="fa fa-info-circle mr-1"></i>
                Đang hiển thị <span id="shownCount" class="font-semibold">0</span> / <span id="totalCount">0</span> tình huống — Chọn nhóm để lọc, gõ từ khóa để tìm nhanh
            </p>
        </div>

        <!-- Bộ lọc nhóm -->
        <div id="filterBar" class="flex flex-wrap gap-2 mb-6">
            <button class="filter-btn px-4 py-2 rounded-full text-sm font-medium" data-group="all">Tất cả</button>
            <button class="filter-btn px-4 py-2 rounded-full text-sm font-medium" data-group="phucvu">🧑‍🤝‍🧑 Phục vụ & Tiếp nhận</button>
            <button class="filter-btn px-4 py-2 rounded-full text-sm font-medium" data-group="chatluong">🍽️ Chất lượng món & đồ uống</button>
            <button class="filter-btn px-4 py-2 rounded-full text-sm font-medium" data-group="thanhtoan">💵 Thanh toán & Giá</button>
            <button class="filter-btn px-4 py-2 rounded-full text-sm font-medium" data-group="hanhvi">😤 Hành vi khách</button>
            <button class="filter-btn px-4 py-2 rounded-full text-sm font-medium" data-group="antoan">🚨 An toàn & Khẩn cấp</button>
        </div>

        <!-- Danh sách tình huống -->
        <div id="situationList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
            <!-- Được điền bằng JavaScript -->
        </div>

        <!-- Khi không có kết quả tìm kiếm -->
        <div id="noResult" class="hidden py-10 text-center text-gray-500">
            <i class="fa fa-search text-4xl mb-3"></i>
            <p class="text-lg">Không tìm thấy tình huống phù hợp</p>
            <p class="text-sm mt-1">Thử từ khóa khác hoặc chọn nhóm khác</p>
        </div>

        <noscript>
            <p class="text-center text-red-600 py-6">Trình duyệt đang tắt JavaScript. Hãy bật JavaScript để xem cẩm nang.</p>
        </noscript>
    </div>

    <!-- Chi tiết tình huống (Modal) -->
    <div id="detailModal" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="bg-white rounded-xl w-full max-w-3xl max-h-[90vh] overflow-y-auto shadow-2xl">
            <div class="sticky top-0 bg-white border-b p-4 flex justify-between items-start gap-4 z-10">

                    speech: "(Với người đi cùng) \"Anh/chị ấy có bệnh động kinh hay đang dùng thuốc gì không ạ? Em đã gọi cấp cứu, chúng ta ở bên cạnh bạn ấy nhé.\"",

                    prevent: "Hạn chế tiền mặt trong két, nộp tiền giữa ca; camera ở quầy và lối ra; không để một nhân viên đóng cửa một mình"

            {

                group: "antoan",
                title: "Khách bị kẹt trong thang máy",

                tags: ["khẩn cấp", "mới"],
                content: {
                    background: "Nhà hàng nhiều tầng, mất điện, thang quá tải",
                    cause: "Sự cố kỹ thuật, mất điện, chở quá số người cho phép",
                    steps: [
                        "Nói chuyện với khách qua cửa hoặc chuông liên lạc, trấn an: đã có người đang xử lý",

                        "Gọi ngay đơn vị bảo trì thang máy theo số dán trong thang",
                        "Có người khó thở, hoảng loạn, có trẻ em hoặc chờ quá lâu → gọi 114",
                        "Không tự cứu hộ bằng chìa khóa cửa tầng nếu chưa được đào tạo",
                        "Sau khi khách ra: hỏi thăm sức khỏe, cho nghỉ ngơi, ngừng dùng thang đến khi được kiểm tra"
                    ],
                    speech: "\"Anh/chị ơi, em đang ở ngay bên ngoài, đã gọi kỹ thuật và họ đang đến. Anh/chị ngồi xuống nghỉ, đừng cạy cửa nhé, em nói chuyện với anh/chị suốt ạ.\"",
                    avoid: ["Tự cạy cửa thang máy", "Để khách một mình không ai liên lạc", "Cho thang chạy tiếp khi chưa kiểm tra"],
                    responsible: "Quản lý ca / Kỹ thuật",
                    prevent: "Bảo trì thang máy định kỳ; dán số đơn vị bảo trì trong thang; biển giới hạn số người; ưu tiên thang bộ khi mất điện"
                }

        ];

        // ===== CẤU HÌNH NHÓM =====
        const groups = {
            phucvu:    { name: "Phục vụ & Tiếp nhận",       icon: "🧑‍🤝‍🧑", color: "bg-blue-100 text-blue-800",   border: "border-blue-400" },
            chatluong: { name: "Chất lượng món & đồ uống",  icon: "🍽️", color: "bg-amber-100 text-amber-800", border: "border-amber-400" },
            thanhtoan: { name: "Thanh toán & Giá",          icon: "💵", color: "bg-green-100 text-green-800", border: "border-green-500" },
            hanhvi:    { name: "Hành vi khách",             icon: "😤", color: "bg-purple-100 text-purple-800", border: "border-purple-400" },
            antoan:    { name: "An toàn & Khẩn cấp",        icon: "🚨", color: "bg-red-100 text-red-800",     border: "border-red-500" }
        };

        const tagColors = {
            "khẩn cấp":   "bg-red-600 text-white",
            "quan trọng": "bg-orange-100 text-orange-800",
            "thường gặp": "bg-blue-100 text-blue-800",
            "trung bình": "bg-gray-200 text-gray-700",
            "mới":        "bg-accent text-white"
        };

        // ===== TIỆN ÍCH =====
        // Bỏ dấu tiếng Việt để tìm kiếm không dấu
        function normalize(str) {
            return String(str)
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/đ/g, "d").replace(/Đ/g, "D")
                .toLowerCase();
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;").replace(/</g, "&lt;")
                .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        // Tô sáng từ khóa (so khớp không dấu nhưng giữ nguyên chữ gốc)
        function highlight(text, keyword) {
            const safe = escapeHtml(text);
            if (!keyword) return safe;
            const normText = normalize(safe);
            const normKey = normalize(keyword);
            const idx = normText.indexOf(normKey);
            if (idx === -1) return safe;
            return safe.slice(0, idx) + "<mark>" + safe.slice(idx, idx + normKey.length) + "</mark>" + safe.slice(idx + normKey.length);
        }

        // Tạo chuỗi tìm kiếm sẵn cho mỗi tình huống
        situations.forEach(s => {
            const c = s.content;
            s._search = normalize([
                s.title, s.summary, s.tags.join(" "), groups[s.group].name,
                c.background, c.cause, c.steps.join(" "), c.speech, c.avoid.join(" "), c.responsible, c.prevent
            ].join(" "));
        });

        // ===== TRẠNG THÁI =====
        let currentGroup = "all";
        let keyword = "";

        const listEl = document.getElementById("situationList");
        const noResultEl = document.getElementById("noResult");
        const searchInput = document.getElementById("searchInput");
        const clearBtn = document.getElementById("clearSearch");
        const modal = document.getElementById("detailModal");
        const modalTitle = document.getElementById("modalTitle");
        const modalContent = document.getElementById("modalContent");

        document.getElementById("totalCount").textContent = situations.length;

        // Hiển thị số lượng trên nút lọc
        document.querySelectorAll(".filter-btn").forEach(btn => {
            const g = btn.dataset.group;
            const count = g === "all" ? situations.length : situations.filter(s => s.group === g).length;
            btn.insertAdjacentHTML("beforeend", ` <span class="count-badge ml-1 text-xs opacity-75">(${count})</span>`);
        });

        function updateFilterButtons() {
            document.querySelectorAll(".filter-btn").forEach(btn => {
                const active = btn.dataset.group === currentGroup;
                btn.classList.toggle("bg-primary", active);
                btn.classList.toggle("text-white", active);
                btn.classList.toggle("shadow", active);
                btn.classList.toggle("bg-gray-200", !active);
                btn.classList.toggle("hover:bg-gray-300", !active);
                btn.setAttribute("aria-pressed", active ? "true" : "false");
            });
        }

        // ===== HIỂN THỊ DANH SÁCH =====
        function render() {
            const key = normalize(keyword.trim());
            const filtered = situations.filter(s =>
                (currentGroup === "all" || s.group === currentGroup) &&
                (!key || s._search.includes(key))
            );

            document.getElementById("shownCount").textContent = filtered.length;
            noResultEl.classList.toggle("hidden", filtered.length > 0);

            listEl.innerHTML = filtered.map(s => {
                const g = groups[s.group];
                const tags = s.tags.map(t =>
                    `<span class="tag ${tagColors[t] || "bg-gray-100 text-gray-700"}">${escapeHtml(t)}</span>`
                ).join("");
                return `
                <article class="card-hover bg-white rounded-xl shadow-sm border-t-4 ${g.border} p-5 cursor-pointer flex flex-col focus:outline-none focus:ring-2 focus:ring-secondary"
                    data-id="${s.id}" tabindex="0" role="button" aria-label="Xem chi tiết: ${escapeHtml(s.title)}">
                    <div class="flex items-center justify-between mb-2 gap-2">
                        <span class="tag ${g.color}">${g.icon} ${g.name}</span>
                        <span class="text-xs text-gray-400">#${s.id}</span>
                    </div>
                    <h3 class="font-semibold text-lg leading-snug mb-2">${highlight(s.title, keyword.trim())}</h3>
                    <p class="text-sm text-gray-600 mb-4 flex-1">${highlight(s.summary, keyword.trim())}</p>
                    <div class="flex items-center justify-between gap-2">
                        <div class="flex flex-wrap gap-1">${tags}</div>
                        <span class="text-primary text-sm font-medium whitespace-nowrap">Xem <i class="fa fa-angle-right"></i></span>
                    </div>
                </article>`;
            }).join("");
        }

        // ===== CHI TIẾT (MODAL) =====
        function section(icon, title, colorClass, body) {
            return `
            <section class="mb-5">
                <h3 class="font-semibold mb-2 flex items-center gap-2 ${colorClass}">
                    <i class="fa ${icon} w-5 text-center"></i>${title}
                </h3>
                ${body}
            </section>`;
        }

        function openDetail(id) {
            const s = situations.find(x => x.id === id);
            if (!s) return;
            const c = s.content;
            const g = groups[s.group];

            modalTitle.innerHTML = `<span class="text-sm font-normal text-gray-400 block mb-1">${g.icon} ${g.name} · #${s.id}</span>${escapeHtml(s.title)}`;

            const emergency = s.group === "antoan" ? `
                <div class="bg-red-50 border border-red-200 rounded-lg p-3 mb-5 flex flex-wrap gap-x-6 gap-y-2 text-sm text-red-800">
                    <span class="font-semibold"><i class="fa fa-phone mr-1"></i>Số khẩn cấp:</span>
                    <span><b>113</b> Công an</span>
                    <span><b>114</b> Cứu hỏa – Cứu nạn</span>
                    <span><b>115</b> Cấp cứu y tế</span>
                </div>` : "";

            modalContent.innerHTML = `
                ${emergency}
                <div class="grid md:grid-cols-2 gap-4 mb-5">
                    <div class="bg-gray-50 rounded-lg p-3">
                        <p class="text-xs uppercase tracking-wide text-gray-500 mb-1"><i class="fa fa-clock-o mr-1"></i>Bối cảnh</p>
                        <p class="text-sm">${escapeHtml(c.background)}</p>
                    </div>
                    <div class="bg-gray-50 rounded-lg p-3">
                        <p class="text-xs uppercase tracking-wide text-gray-500 mb-1"><i class="fa fa-question-circle mr-1"></i>Nguyên nhân</p>
                        <p class="text-sm">${escapeHtml(c.cause)}</p>
                    </div>
                </div>

                ${section("fa-list-ol", "Các bước xử lý", "text-dark", `
                    <ol class="space-y-2">
                        ${c.steps.map((st, i) => `
                            <li class="flex gap-3">
                                <span class="shrink-0 w-6 h-6 rounded-full bg-primary text-white text-xs font-bold flex items-center justify-center">${i + 1}</span>
                                <span class="text-sm pt-0.5">${escapeHtml(st)}</span>
                            </li>`).join("")}
                    </ol>`)}

                ${section("fa-comment", "Mẫu câu gợi ý", "text-accent", `
                    <blockquote class="bg-green-50 border-l-4 border-accent p-3 rounded-r text-sm italic">${escapeHtml(c.speech)}</blockquote>`)}

                ${section("fa-ban", "Tuyệt đối tránh", "text-primary", `
                    <ul class="space-y-1">
                        ${c.avoid.map(a => `<li class="text-sm flex gap-2"><i class="fa fa-times text-primary mt-1"></i><span>${escapeHtml(a)}</span></li>`).join("")}
                    </ul>`)}

                <div class="grid md:grid-cols-2 gap-4">
                    <div class="bg-blue-50 rounded-lg p-3">
                        <p class="text-xs uppercase tracking-wide text-blue-600 mb-1"><i class="fa fa-user mr-1"></i>Người phụ trách</p>
                        <p class="text-sm">${escapeHtml(c.responsible)}</p>
                    </div>
                    <div class="bg-amber-50 rounded-lg p-3">
                        <p class="text-xs uppercase tracking-wide text-amber-700 mb-1"><i class="fa fa-shield mr-1"></i>Phòng ngừa</p>
                        <p class="text-sm">${escapeHtml(c.prevent)}</p>
                    </div>
                </div>`;

            modal.classList.remove("hidden");
            modal.classList.add("flex");
            document.body.style.overflow = "hidden";
            modal.querySelector(".overflow-y-auto").scrollTop = 0;
            document.getElementById("closeModal").focus();
        }

        function closeDetail() {
            modal.classList.add("hidden");
            modal.classList.remove("flex");
            document.body.style.overflow = "";
        }

        // ===== SỰ KIỆN =====
        document.getElementById("filterBar").addEventListener("click", e => {
            const btn = e.target.closest(".filter-btn");
            if (!btn) return;
            currentGroup = btn.dataset.group;
            updateFilterButtons();
            render();
        });

        let searchTimer;
        searchInput.addEventListener("input", () => {
            clearTimeout(searchTimer);
            clearBtn.classList.toggle("hidden", !searchInput.value);
            searchTimer = setTimeout(() => {
                keyword = searchInput.value;
                render();
            }, 150);
        });

        clearBtn.addEventListener("click", () => {
            searchInput.value = "";
            keyword = "";
            clearBtn.classList.add("hidden");
            render();
            searchInput.focus();
        });

        listEl.addEventListener("click", e => {
            const card = e.target.closest("[data-id]");
            if (card) openDetail(Number(card.dataset.id));
        });

        listEl.addEventListener("keydown", e => {
            if (e.key !== "Enter" && e.key !== " ") return;
            const card = e.target.closest("[data-id]");
            if (card) { e.preventDefault(); openDetail(Number(card.dataset.id)); }
        });

        document.getElementById("closeModal").addEventListener("click", closeDetail);
        document.getElementById("printBtn").addEventListener("click", () => window.print());
        modal.addEventListener("click", e => { if (e.target === modal) closeDetail(); });

        document.addEventListener("keydown", e => {
            if (e.key === "Escape" && !modal.classList.contains("hidden")) closeDetail();
            // Phím "/" để nhảy nhanh vào ô tìm kiếm
            if (e.key === "/" && document.activeElement !== searchInput && modal.classList.contains("hidden")) {
                e.preventDefault();
                searchInput.focus();
            }
        });

        // ===== KHỞI ĐỘNG =====
        updateFilterButtons();
        render();
    </script>
</body>
